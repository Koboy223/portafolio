<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Test de Pescados y Mariscos - 100 Preguntas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #cffafe 100%);

            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .test-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #e5e7eb;
            height: 8px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .question-content {
            padding: 40px;
        }

        .question-type {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .type-multiple {
            background: #dbeafe;
            color: #1e40af;
        }

        .type-boolean {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #f9fafb;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05em;
        }

        .option:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .option.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .boolean-options {
            display: flex;
            gap: 20px;
        }

        .boolean-options .option {
            flex: 1;
            text-align: center;
            font-weight: 600;
            font-size: 1.2em;
            padding: 30px;
        }

        .option.true.selected {
            background: #16a34a;
            border-color: #16a34a;
        }

        .option.false.selected {
            background: #dc2626;
            border-color: #dc2626;
        }

        .feedback-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.05em;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-correct {
            background: #f0fdf4;
            border: 2px solid #86efac;
            color: #166534;
        }

        .feedback-incorrect {
            background: #fef2f2;
            border: 2px solid #fca5a5;
            color: #991b1b;
        }

        .feedback-box strong {
            display: block;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .feedback-icon {
            font-size: 1.5em;
            margin-right: 8px;
        }

        .correct-answer-text {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
        }

        .btn-prev {
            background: #d1d5db;
            color: #374151;
        }

        .btn-prev:hover:not(:disabled) {
            background: #9ca3af;
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: #2563eb;
            color: white;
        }

        .btn-next:hover {
            background: #1d4ed8;
        }

        .btn-finish {
            background: #16a34a;
            color: white;
        }

        .btn-finish:hover:not(:disabled) {
            background: #15803d;
        }

        .btn-finish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-text {
            color: #6b7280;
            font-size: 0.9em;
        }

        .results-container {
            padding: 40px;
        }

        .score-card {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;

            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-percentage {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .score-message {

        }

            font-size: 1.8em;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .review-item {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid;
        }

        .review-item.correct {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .review-item.incorrect {
            background: #fef2f2;
            border-color: #fca5a5;
        }

        .review-question {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
        }

        .review-icon {

        }

        .review-answers {

        }

        }

        .user-answer {

        }

        .correct-answer {
            color: #16a34a;
            font-weight: 600;
        }

        .btn-restart {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 15px;
            font-size: 1.1em;
            margin-top: 20px;
        }

            background: #1d4ed8;
        }

        @media (max-width: 768px) {
            .question-content {
                padding: 25px;
            }

                font-size: 1.2em;
            }

                padding: 20px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .boolean-options {
                flex-direction: column;
            }
        }
    </style>
</head>

        // Función para mezclar array (Fisher-Yates shuffle)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Mezclar preguntas y opciones
        function prepareQuestions() {
            const shuffled = shuffleArray(allQuestions);
            return shuffled.map(q => {
                if (q.type === 'multiple') {
                    const shuffledOptions = shuffleArray(q.options.map((opt, idx) => ({ text: opt, index: idx })));
                    return {
                        ...q,
                        shuffledOptions: shuffledOptions,
                        newCorrect: shuffledOptions.findIndex(opt => opt.index === q.correct)
                    };
                }
                return q;
            });
        }

        let questions = prepareQuestions();
        let currentQuestion = 0;
        let answers = {};
        let showResults = false;

        function render() {
            const testCard = document.getElementById('testCard');
            
            if (showResults) {
                renderResults();
            } else {
                renderQuestion();
            }
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            const answeredCount = Object.keys(answers).length;
            const hasAnswered = answers[currentQuestion] !== undefined;

            // Verificar si la respuesta es correcta
            let isCorrect = false;
            let feedbackHTML = '';
            if (hasAnswered) {
                const userAnswer = answers[currentQuestion];
                const correctAnswer = q.type === 'multiple' ? q.newCorrect : q.correct;
                isCorrect = userAnswer === correctAnswer;

                if (isCorrect) {
                    feedbackHTML = `
                        <div class="feedback-box feedback-correct">
                            <strong><span class="feedback-icon">✓</span>¡Correcto!</strong>
                            <p>Has respondido correctamente esta pregunta.</p>
                        </div>
                    `;
                } else {
                    let correctAnswerText;
                    if (q.type === 'multiple') {
                        correctAnswerText = q.shuffledOptions[correctAnswer].text;
                    } else {
                        correctAnswerText = correctAnswer ? 'Verdadero' : 'Falso';
                    }
                    
                    feedbackHTML = `
                        <div class="feedback-box feedback-incorrect">
                            <strong><span class="feedback-icon">✗</span>Incorrecto</strong>
                            <p>Tu respuesta no es correcta.</p>
                            <div class="correct-answer-text">
                                <strong>Respuesta correcta:</strong> ${correctAnswerText}
                            </div>
                        </div>
                    `;
                }
            }

            const optionsHTML = q.type === 'multiple' 
                ? q.shuffledOptions.map((opt, idx) => `
                    <div class="option ${answers[currentQuestion] === idx ? 'selected' : ''}" 
                         onclick="selectAnswer(${idx})">
                        <strong>${String.fromCharCode(65 + idx)}.</strong> ${opt.text}
                    </div>
                `).join('')
                : `
                    <div class="boolean-options">
                        <div class="option true ${answers[currentQuestion] === true ? 'selected' : ''}" 
                             onclick="selectAnswer(true)">
                            Verdadero
                        </div>
                        <div class="option false ${answers[currentQuestion] === false ? 'selected' : ''}" 
                             onclick="selectAnswer(false)">
                            Falso
                        </div>
                    </div>
                `;

            const navigationHTML = currentQuestion === questions.length - 1
                ? `<button class="btn btn-finish" onclick="finishTest()" ${answeredCount !== questions.length ? 'disabled' : ''}>
                       Finalizar Test
                   </button>`
                : `<button class="btn btn-next" onclick="nextQuestion()">
                       Siguiente →
                   </button>`;

            document.getElementById('testCard').innerHTML = `
                <div class="header">
                    <h1>Test de Pescados y Mariscos</h1>
                    <p>Pregunta ${currentQuestion + 1} de ${questions.length}</p>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
                <div class="question-content">
                    <span class="question-type ${q.type === 'multiple' ? 'type-multiple' : 'type-boolean'}">
                        ${q.type === 'multiple' ? 'Opción Múltiple' : 'Verdadero/Falso'}
                    </span>
                    <h2 class="question-text">${q.question}</h2>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                    ${feedbackHTML}
                </div>
                <div class="navigation">
                    <button class="btn btn-prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        ← Anterior
                    </button>
                    <span class="progress-text">${answeredCount} de ${questions.length} respondidas</span>
                    ${navigationHTML}
                </div>
            `;
        }

        function renderResults() {
            let correctCount = 0;
            questions.forEach((q, idx) => {
                const userAnswer = answers[idx];
                const correctAnswer = q.type === 'multiple' ? q.newCorrect : q.correct;
                if (userAnswer === correctAnswer) {
                    correctCount++;
                }
            });

            const percentage = ((correctCount / questions.length) * 100).toFixed(1);
            let message = '';
            if (percentage >= 90) message = '¡Excelente trabajo! Dominas el tema.';
            else if (percentage >= 70) message = '¡Buen trabajo! Conoces bien el material.';
            else if (percentage >= 50) message = 'Aprobado, pero puedes mejorar.';
            else message = 'Necesitas estudiar más el material.';

            const reviewHTML = questions.map((q, idx) => {
                const userAnswer = answers[idx];
                const correctAnswer = q.type === 'multiple' ? q.newCorrect : q.correct;
                const isCorrect = userAnswer === correctAnswer;

                let userAnswerText, correctAnswerText;
                if (q.type === 'multiple') {
                    userAnswerText = q.shuffledOptions[userAnswer]?.text || 'No respondida';
                    correctAnswerText = q.shuffledOptions[correctAnswer].text;
                } else {
                    userAnswerText = userAnswer ? 'Verdadero' : 'Falso';
                    correctAnswerText = correctAnswer ? 'Verdadero' : 'Falso';
                }

                return `
                    <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="review-question">
                            <span class="review-icon">${isCorrect ? '✓' : '✗'}</span>
                            <span>${idx + 1}. ${q.question}</span>
                        </div>
                        <div class="review-answers">
                            <p class="user-answer"><strong>Tu respuesta:</strong> ${userAnswerText}</p>
                            ${!isCorrect ? `<p class="correct-answer"><strong>Respuesta correcta:</strong> ${correctAnswerText}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('testCard').innerHTML = `
                <div class="header">
                    <h1>Resultados del Test</h1>
                </div>
                <div class="results-container">
                    <div class="score-card">
                        <div class="score-number">${correctCount}/${questions.length}</div>
                        <div class="score-percentage">Puntuación: ${percentage}%</div>
                        <div class="score-message">${message}</div>
                    </div>
                    <div class="review-section">
                        <h2>Revisión de Respuestas</h2>
                        ${reviewHTML}
                    </div>
                    <button class="btn btn-restart" onclick="restartTest()">
                        🔄 Reintentar Test
                    </button>
                </div>
            `;
        }

        function selectAnswer(answer) {
            answers[currentQuestion] = answer;
            render();
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                render();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                render();
            }
        }

        function finishTest() {
            if (Object.keys(answers).length === questions.length) {
                showResults = true;
                render();
            }
        }

        function restartTest() {
            questions = prepareQuestions();
            currentQuestion = 0;
            answers = {};
            showResults = false;
            render();
        }

        // Inicializar
        render();
    </script>
